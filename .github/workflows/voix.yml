# Le robot « Voix » : génère les fichiers audio des répliques avec ElevenLabs, les range dans app/audio/,
# les enregistre sur la branche choisie, puis relance la mise en ligne (version de test pour une branche, officielle pour main).
# À lancer à la main : onglet « Actions » → « Voix » → « Run workflow ».
# La clé ElevenLabs est rangée dans le coffre-fort de GitHub (Settings → Secrets and variables → Actions → ELEVENLABS_API_KEY) :
# elle n'apparaît jamais dans le code ni dans les journaux.
name: Voix

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "Voix : essai (10 répliques, refaites), tout (ce qui manque), tout-refaire (les rôles choisis, en entier) ou liste (les répliques de outils/a-refaire.txt). Bruitages du court : sons-essai (3 sons) ou sons (tous)."
        type: choice
        options: [essai, tout, tout-refaire, liste, sons-essai, sons]
        default: essai
      roles:
        description: "Les voix à générer (séparées par des virgules)"
        default: "commentateur,commentatrice,arbitre"
      ids:
        description: "Facultatif : refaire seulement ces répliques ou ces sons (noms des fichiers sans .mp3, séparés par des virgules)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: voix
  cancel-in-progress: false

jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer les voix
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          QUOI: ${{ inputs.quoi }}
          ROLES: ${{ inputs.roles }}
          IDS: ${{ inputs.ids }}
        run: |
          ESSAI="commentateur_balle_match_convertie_03,commentateur_tension_01,commentateur_craquage_02,commentateur_defaite_01,commentateur_obstination_02,commentatrice_craquage_02,commentatrice_victoire_02,commentatrice_defaite_02,commentatrice_set_ecrasant_02,commentatrice_serie_contre_03"
          if [ "$QUOI" = "sons-essai" ]; then node outils/generer-sons.js --ids "raquette_pierre_01,raquette_pierre_fort_01,public_point_01"
          elif [ "$QUOI" = "sons" ] && [ -n "$IDS" ]; then node outils/generer-sons.js --ids "$IDS" --refaire
          elif [ "$QUOI" = "sons" ]; then node outils/generer-sons.js
          elif [ -n "$IDS" ]; then node outils/generer-voix.js --ids "$IDS" --refaire
          elif [ "$QUOI" = "essai" ]; then node outils/generer-voix.js --ids "$ESSAI" --refaire
          elif [ "$QUOI" = "tout-refaire" ]; then node outils/generer-voix.js --roles "$ROLES" --refaire
          elif [ "$QUOI" = "liste" ]; then node outils/generer-voix.js --ids "$(grep -v '^#' outils/a-refaire.txt | grep . | paste -sd, -)" --refaire
          else node outils/generer-voix.js --roles "$ROLES"
          fi

      - name: Enregistrer les fichiers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/audio
          if git diff --cached --quiet; then echo "Aucun nouveau fichier"; exit 0; fi
          git commit -qm "Voix : $(git diff --cached --name-only | wc -l) fichier(s) audio générés"
          # La branche a pu bouger pendant la génération : on reprend ses nouveautés avant d'envoyer.
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
          # Une modification faite par le robot ne relance pas la mise en ligne toute seule : on la demande.
          gh workflow run deploiement.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

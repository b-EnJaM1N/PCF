<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandSlam Invaders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
/* Écran d'arcade unique (thème sombre assumé) : barre de score, terrain, 3 gros boutons de tir. */
:root {
  --court: #173F73; --court-deep: #0F2C52; --line: #F5F7FA; --me: #F4C542; --bot: #E8574A;
  --muted: #9DB4D3; --panel: rgba(255, 255, 255, .07); --good: #5BD69A;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--court-deep); color: var(--line); font-family: var(--body);
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.jeu {
  height: 100%; display: flex; flex-direction: column; gap: 8px; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px; box-sizing: border-box;
}
.colonne { display: flex; flex-direction: column; gap: 10px; width: 58px; flex: none; min-height: 0; }
.colonne .titre { font-family: var(--display); font-weight: 800; font-size: .95rem; line-height: .95; text-align: center; letter-spacing: .02em; }
.colonne .titre b { color: var(--me); }
.compteurs { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; text-align: center; }
.compteurs div { display: flex; flex-direction: column; align-items: center; }
.compteurs span { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.compteurs strong { font-family: var(--display); font-size: 1.35rem; font-weight: 800; color: var(--line); line-height: 1; }
#vies { font-size: .8rem; line-height: 1.3; }
.terrain {
  position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 100%, var(--court) 0%, var(--court-deep) 75%);
  border: 2px solid rgba(245, 247, 250, .18); touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; }
.zone { flex: 1; min-height: 0; display: flex; gap: 6px; }
.zone.gaucher { flex-direction: row-reverse; }
.boutons { display: flex; flex-direction: column; gap: 4px; flex: 0 0 48%; }
.boutons button { flex: 1; justify-content: center; }
.cote { font: inherit; font-size: .85rem; border: 1px solid rgba(245, 247, 250, .3); background: transparent; color: var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.boutons button {
  font: inherit; border: 0; border-radius: 16px; padding: 10px 0 8px; background: var(--panel); color: var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; cursor: pointer;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25);
}
.boutons button .e { font-size: 1.7rem; line-height: 1; }
.boutons button .n { font-family: var(--display); font-weight: 700; font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.boutons button:active, .boutons button.appuye { background: var(--me); color: var(--court-deep); transform: translateY(2px); box-shadow: none; }
.boutons button:active .n, .boutons button.appuye .n { color: var(--court-deep); }
.boutons button:focus-visible, .ecran button:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }
.ecran {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 20px; text-align: center; background: rgba(15, 44, 82, .88); backdrop-filter: blur(2px);
}
.ecran h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 11vw, 3.2rem); line-height: .95; margin: 0; text-wrap: balance; }
.ecran h1 b { color: var(--me); }
.ecran p { margin: 0; color: var(--muted); max-width: 30ch; line-height: 1.4; }
.regles { display: grid; grid-template-columns: auto auto auto; gap: 6px 12px; align-items: center; font-size: 1.05rem; }
.regles .e { font-size: 1.7rem; }
.regles .fl { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
.ecran .go {
  font-family: var(--display); font-weight: 800; font-size: 1.4rem; letter-spacing: .04em; text-transform: uppercase;
  border: 0; border-radius: 999px; padding: 12px 34px; background: var(--me); color: var(--court-deep); cursor: pointer;
}
.ecran .petit { font-size: .82rem; }
.ecran .gros { font-family: var(--display); font-size: 3.4rem; font-weight: 800; color: var(--me); line-height: 1; font-variant-numeric: tabular-nums; }
.son { position: absolute; top: 8px; right: 8px; border: 0; background: var(--panel); color: var(--line); border-radius: 999px; width: 36px; height: 36px; font-size: 1rem; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .boutons button:active { transform: none; } }
</style>

<div class="jeu">
  <div class="zone" id="zone">
  <div class="colonne">
    <div class="titre">HAND<br><b>SLAM</b></div>
    <div class="compteurs">
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Record</span><strong id="record">0</strong></div>
      <div id="vies" aria-label="Vies">❤️❤️❤️</div>
    </div>
  <div class="boutons">
    <button id="bPierre" data-signe="pierre"><span class="e">✊</span><span class="n">Pierre</span></button>
    <button id="bFeuille" data-signe="feuille"><span class="e">✋</span><span class="n">Feuille</span></button>
    <button id="bCiseaux" data-signe="ciseaux"><span class="e">✌️</span><span class="n">Ciseaux</span></button>
  </div>
  </div>

  <div class="terrain" id="terrain">
    <canvas id="toile"></canvas>
    <button class="son" id="son" aria-label="Couper le son">🔊</button>

    <div class="ecran" id="accueil">
      <h1>HAND<b>SLAM</b><br>Invaders</h1>
      <p>Les signes tombent. Place-toi dessous et tire celui qui les bat.</p>
      <div class="regles">
        <span class="e">✌️</span><span class="fl">→ tire</span><span class="e">✊</span>
        <span class="e">✋</span><span class="fl">→ tire</span><span class="e">✌️</span>
        <span class="e">✊</span><span class="fl">→ tire</span><span class="e">✋</span>
      </div>
      <p class="petit">Une main choisit le signe sur le côté, l'autre glisse sur le terrain pour bouger. Un mauvais signe fait accélérer l'ennemi.</p>
      <button class="go" id="jouer">Jouer</button>
      <button class="cote" id="cote">Mettre les signes à droite</button>
    </div>

    <div class="ecran" id="fin" hidden>
      <h1>Fin de partie</h1>
      <div class="gros" id="scoreFin">0</div>
      <p id="detailFin"></p>
      <button class="go" id="rejouer">Rejouer</button>
    </div>
  </div>
  </div>
</div>

<script>
(() => {
  const EMOJI = { pierre: "✊", feuille: "✋", ciseaux: "✌️" };
  const BAT = { pierre: "ciseaux", feuille: "pierre", ciseaux: "feuille" }; // ce que chaque signe bat
  const SIGNES = Object.keys(EMOJI);
  const COUL = { me: "#F4C542", bot: "#E8574A", line: "#F5F7FA", muted: "#9DB4D3", good: "#5BD69A" };

  const $ = id => document.getElementById(id);
  const toile = $("toile"), ctx = toile.getContext("2d"), terrain = $("terrain");
  let W = 0, H = 0, R = 22; // R : rayon d'un signe

  function redimensionner() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = terrain.clientWidth; H = terrain.clientHeight;
    toile.width = W * dpr; toile.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.max(18, Math.min(28, W / 15));
    if (J) J.x = Math.min(Math.max(J.x, R), W - R);
  }

  // ---------- Son (petits bips, aucun fichier) ----------
  let audio = null, sonActif = true;
  function bip(freq, duree = 0.08, type = "square", vol = 0.06, glisse = 0) {
    if (!sonActif) return;
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + glisse), t + duree);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + duree + 0.02);
    } catch (e) { /* pas de son, tant pis */ }
  }
  $("son").addEventListener("click", () => {
    sonActif = !sonActif; $("son").textContent = sonActif ? "🔊" : "🔇";
    $("son").setAttribute("aria-label", sonActif ? "Couper le son" : "Remettre le son");
  });

  // ---------- Record ----------
  let record = 0;
  try { record = +localStorage.getItem("hs-invaders-record") || 0; } catch (e) {}
  $("record").textContent = record;

  // ---------- Côté des boutons (gauche par défaut) ----------
  let aDroite = false;
  try { aDroite = localStorage.getItem("hs-invaders-cote") === "droite"; } catch (e) {}
  function appliquerCote() {
    $("zone").classList.toggle("gaucher", aDroite);
    $("cote").textContent = aDroite ? "Mettre les signes à gauche" : "Mettre les signes à droite";
  }
  $("cote").addEventListener("click", () => {
    aDroite = !aDroite; appliquerCote();
    try { localStorage.setItem("hs-invaders-cote", aDroite ? "droite" : "gauche"); } catch (e) {}
  });
  appliquerCote();

  // ---------- État de la partie ----------
  let J = null, enCours = false, dernier = 0;

  function nouvellePartie() {
    J = {
      x: W / 2, cible: W / 2, vies: 3, score: 0, combo: 0, meilleurCombo: 0, touches: 0, rates: 0,
      ennemis: [], tirs: [], eclats: [], textes: [], prochain: 600, temps: 0, recharge: 0, flash: 0,
    };
    majCompteurs();
  }

  // La difficulté monte avec le temps : chute plus rapide, apparitions plus serrées.
  const niveau = () => Math.min(1, J.temps / 120000);
  const vitesse = () => 55 + 115 * niveau() + Math.random() * 25;     // pixels par seconde
  const intervalle = () => 1500 - 950 * niveau() + Math.random() * 400; // millisecondes

  function faireApparaitre() {
    const x = R + Math.random() * (W - 2 * R);
    const zigzag = niveau() > 0.35 && Math.random() < 0.3;
    J.ennemis.push({ x, x0: x, y: -R, v: vitesse(), signe: SIGNES[Math.random() * 3 | 0], zigzag, phase: Math.random() * 6, bond: 0 });
  }

  function tirer(signe) {
    if (!enCours || J.recharge > 0) return;
    J.recharge = 170;
    J.tirs.push({ x: J.x, y: H - R * 2.6, signe });
    bip(660, 0.06, "square", 0.04, 300);
  }

  function eclater(x, y, couleur, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
      J.eclats.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 1, couleur });
    }
  }
  const texte = (x, y, t, couleur) => J.textes.push({ x, y, t, couleur, vie: 1 });

  function perdreVie(x, y) {
    J.vies--; J.combo = 0; J.flash = 1;
    eclater(x, y, COUL.bot, 18);
    bip(140, 0.35, "sawtooth", 0.08, -90);
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    majCompteurs();
    if (J.vies <= 0) finir();
  }

  function majCompteurs() {
    $("score").textContent = J.score;
    $("vies").textContent = "❤️".repeat(Math.max(0, J.vies)) + "🖤".repeat(3 - Math.max(0, J.vies));
  }

  function finir() {
    enCours = false;
    const nouveau = J.score > record;
    if (nouveau) { record = J.score; try { localStorage.setItem("hs-invaders-record", record); } catch (e) {} }
    $("record").textContent = record;
    $("scoreFin").textContent = J.score;
    const precision = J.touches + J.rates ? Math.round(100 * J.touches / (J.touches + J.rates)) : 0;
    $("detailFin").textContent = (nouveau ? "Nouveau record ! " : "") +
      `${J.touches} signes battus · meilleure série ×${J.meilleurCombo} · précision ${precision} %`;
    $("fin").hidden = false;
    $("rejouer").focus();
  }

  function demarrer() {
    nouvellePartie();
    $("accueil").hidden = true; $("fin").hidden = true;
    enCours = true; dernier = performance.now();
    bip(520, 0.1, "triangle", 0.06); setTimeout(() => bip(780, 0.12, "triangle", 0.06), 110);
  }
  $("jouer").addEventListener("click", demarrer);
  $("rejouer").addEventListener("click", demarrer);

  // ---------- Commandes ----------
  terrain.addEventListener("pointerdown", e => { if (e.target === toile) deplacer(e); });
  terrain.addEventListener("pointermove", e => { if (e.target === toile && (e.pointerType !== "mouse" || e.buttons)) deplacer(e); });
  function deplacer(e) {
    if (!J) return;
    const r = toile.getBoundingClientRect();
    J.cible = Math.min(Math.max(e.clientX - r.left, R), W - R);
  }
  document.querySelectorAll(".boutons button").forEach(b => {
    b.addEventListener("pointerdown", e => { e.preventDefault(); tirer(b.dataset.signe); });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tirer(b.dataset.signe); } });
  });
  const touches = {};
  addEventListener("keydown", e => {
    touches[e.key] = true;
    const s = { "1": "pierre", "2": "feuille", "3": "ciseaux", a: "pierre", z: "feuille", e: "ciseaux" }[e.key.toLowerCase()];
    if (s) { tirer(s); const b = document.querySelector(`[data-signe="${s}"]`); b.classList.add("appuye"); setTimeout(() => b.classList.remove("appuye"), 90); }
  });
  addEventListener("keyup", e => { touches[e.key] = false; });

  // ---------- Boucle ----------
  function maj(dt) {
    J.temps += dt * 1000;
    J.recharge = Math.max(0, J.recharge - dt * 1000);
    J.flash = Math.max(0, J.flash - dt * 2.5);

    // déplacement : clavier ou doigt (avec un peu d'inertie)
    if (touches.ArrowLeft) J.cible = Math.max(R, J.cible - 420 * dt);
    if (touches.ArrowRight) J.cible = Math.min(W - R, J.cible + 420 * dt);
    J.x += (J.cible - J.x) * Math.min(1, dt * 16);

    J.prochain -= dt * 1000;
    if (J.prochain <= 0) { faireApparaitre(); J.prochain = intervalle(); }

    for (const t of J.tirs) t.y -= 520 * dt;
    for (const n of J.ennemis) {
      n.y += n.v * dt;
      if (n.zigzag) { n.phase += dt * 2.2; n.x = Math.min(W - R, Math.max(R, n.x0 + Math.sin(n.phase) * W * 0.18)); }
      n.bond = Math.max(0, n.bond - dt * 4);
    }

    // collisions tir / ennemi
    for (const t of J.tirs) {
      if (t.mort) continue;
      for (const n of J.ennemis) {
        if (n.mort || Math.hypot(t.x - n.x, t.y - n.y) > R * 1.7) continue;
        t.mort = true;
        if (BAT[t.signe] === n.signe) {
          n.mort = true; J.combo++; J.touches++;
          J.meilleurCombo = Math.max(J.meilleurCombo, J.combo);
          const mult = Math.min(5, 1 + Math.floor(J.combo / 5));
          const pts = 10 * mult;
          J.score += pts;
          eclater(n.x, n.y, COUL.me);
          texte(n.x, n.y, mult > 1 ? `+${pts} ×${mult}` : `+${pts}`, COUL.me);
          bip(880 + Math.min(J.combo, 12) * 40, 0.09, "triangle", 0.07);
          majCompteurs();
        } else if (t.signe === n.signe) {
          // égalité : le signe recule un peu
          n.y -= R * 1.2; n.bond = 1;
          texte(n.x, n.y, "Égalité", COUL.muted);
          bip(330, 0.07, "square", 0.04);
        } else {
          // mauvais signe : l'ennemi accélère
          n.v *= 1.25; n.bond = 1; J.combo = 0; J.rates++;
          texte(n.x, n.y, "Raté !", COUL.bot);
          bip(200, 0.12, "square", 0.05, -60);
        }
        break;
      }
    }

    // ennemis qui arrivent en bas ou touchent le joueur
    const yJ = H - R * 1.6;
    for (const n of J.ennemis) {
      if (n.mort) continue;
      if (Math.hypot(n.x - J.x, n.y - yJ) < R * 1.6 || n.y > H + R) {
        n.mort = true; perdreVie(n.x, Math.min(n.y, H - R));
        if (!enCours) break;
      }
    }

    for (const p of J.eclats) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vie -= dt * 1.8; }
    for (const t of J.textes) { t.y -= 40 * dt; t.vie -= dt * 1.3; }

    J.tirs = J.tirs.filter(t => !t.mort && t.y > -R);
    J.ennemis = J.ennemis.filter(n => !n.mort);
    J.eclats = J.eclats.filter(p => p.vie > 0);
    J.textes = J.textes.filter(t => t.vie > 0);
  }

  function pastille(x, y, signe, couleur, rayon, bond = 0) {
    const r = rayon * (1 + bond * 0.15);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(15, 44, 82, .85)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = couleur; ctx.stroke();
    ctx.font = `${r * 1.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(EMOJI[signe], x, y + r * 0.06);
  }

  function dessiner() {
    ctx.clearRect(0, 0, W, H);

    // lignes du terrain (façon parquet de salle)
    ctx.strokeStyle = "rgba(245, 247, 250, .08)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H * 0.5); ctx.lineTo(W, H * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H * 0.5, Math.min(W, H) * 0.16, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(232, 87, 74, .35)"; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(0, H - R * 3.4); ctx.lineTo(W, H - R * 3.4); ctx.stroke(); ctx.setLineDash([]);

    if (!J) return;

    for (const n of J.ennemis) pastille(n.x, n.y, n.signe, COUL.bot, R, n.bond);
    for (const t of J.tirs) pastille(t.x, t.y, t.signe, COUL.me, R * 0.72);

    // joueur
    const yJ = H - R * 1.6;
    ctx.beginPath(); ctx.ellipse(J.x, yJ + R * 1.05, R * 1.1, R * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 0, 0, .3)"; ctx.fill();
    ctx.beginPath(); ctx.arc(J.x, yJ, R * 1.05, 0, Math.PI * 2);
    ctx.fillStyle = COUL.me; ctx.fill();
    ctx.font = `${R * 1.1}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🧤", J.x, yJ + R * 0.06);

    for (const p of J.eclats) { ctx.globalAlpha = Math.max(0, p.vie); ctx.fillStyle = p.couleur; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.font = `800 ${Math.round(R * 0.8)}px "Barlow Condensed", sans-serif`;
    for (const t of J.textes) { ctx.globalAlpha = Math.max(0, t.vie); ctx.fillStyle = t.couleur; ctx.fillText(t.t, t.x, t.y - R * 1.3); }
    ctx.globalAlpha = 1;

    if (J.combo >= 5) {
      ctx.font = `800 ${Math.round(R * 0.85)}px "Barlow Condensed", sans-serif`;
      ctx.fillStyle = COUL.me; ctx.textAlign = "left";
      ctx.fillText(`Série ×${J.combo}`, 12, 20);
    }
    if (J.flash > 0) { ctx.fillStyle = `rgba(232, 87, 74, ${J.flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  }

  function boucle(t) {
    const dt = Math.min(0.05, (t - dernier) / 1000); dernier = t;
    if (enCours) maj(dt);
    dessiner();
    requestAnimationFrame(boucle);
  }

  new ResizeObserver(redimensionner).observe(terrain);
  redimensionner();
  // Démo d'accueil : quelques signes affichés derrière l'écran de départ.
  nouvellePartie();
  J.ennemis.push(
    { x: W * 0.22, x0: W * 0.22, y: H * 0.2, v: 0, signe: "ciseaux", bond: 0 },
    { x: W * 0.55, x0: W * 0.55, y: H * 0.34, v: 0, signe: "feuille", bond: 0 },
    { x: W * 0.8, x0: W * 0.8, y: H * 0.14, v: 0, signe: "pierre", bond: 0 });
  document.addEventListener("visibilitychange", () => { dernier = performance.now(); });
  requestAnimationFrame(boucle);
})();
</script>

</html>
